<!doctype html>
<html lang="en" data-theme="dark" style="color-scheme: dark;"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Little World Made for Tana 🌻</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&amp;family=Dancing+Script:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe6f0;--bg2:#e9ddff;--ink:#4a2c4f;--soft:#8a6a93;--card:rgba(255,255,255,.55);--bd:rgba(255,255,255,.8);--pk:#ec6fa3;--lv:#a98be0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg1:#2b1535;--bg2:#1c1840;--ink:#fbe9f4;--soft:#cdb3d9;--card:rgba(255,255,255,.09);--bd:rgba(255,255,255,.18);color-scheme:dark}}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,var(--bg1),var(--bg2) 60%,var(--bg1));background-attachment:fixed;color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;overflow-x:hidden}
h1,h2,.s{font-family:'Dancing Script','Brush Script MT',cursive;font-weight:700}
h2{font-size:clamp(30px,7vw,48px);text-align:center;margin:0 0 6px;color:var(--pk)}
section{padding:70px 18px;max-width:1000px;margin:auto;position:relative}
.sub{text-align:center;color:var(--soft);margin:0 0 28px;font-style:italic}
.g{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:22px;box-shadow:0 10px 40px #b06ab31f}
.b{font:600 18px 'Cormorant Garamond',Georgia,serif;color:#fff;background:linear-gradient(135deg,var(--pk),var(--lv));border:0;border-radius:99px;padding:13px 26px;cursor:pointer;box-shadow:0 8px 24px #ec6fa355;transition:.3s}
.b:hover{transform:translateY(-2px) scale(1.03)}
#cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#intro{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 35%,#ffd3e6,#d9c8ff 70%);color:#4a2c4f;transition:opacity 1.4s,transform 1.4s}
#intro.out{opacity:0;transform:scale(1.15);pointer-events:none}
#intro h1{font-size:clamp(44px,12vw,84px);margin:8px 0;animation:fi 2s both}
#intro p{margin:6px;animation:fi 2s .6s both;font-size:21px}
#intro .b{margin-top:26px;animation:fi 2s 1.2s both}
@keyframes fi{from{opacity:0;transform:translateY(20px)}}
.sf{width:150px;height:150px;animation:sp 40s linear infinite,fl 4s ease-in-out infinite alternate}
@keyframes sp{to{rotate:360deg}}@keyframes fl{to{translate:0 -10px}}
#main{opacity:0;transition:opacity 1.6s}#main.on{opacity:1}
.hero{text-align:center;min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero h2{font-size:clamp(34px,9vw,60px)}
.cake{position:relative;width:200px;margin:22px auto 6px;height:150px}
.cake i{position:absolute;left:0;right:0;border-radius:14px;display:block}
.l1{bottom:0;height:50px;background:#f7a8c8}.l2{bottom:48px;height:44px;left:20px!important;right:20px!important;background:#e5d4ff}.l3{bottom:90px;height:12px;left:40px!important;right:40px!important;background:#fff;border-radius:8px}
.cd{position:absolute;bottom:100px;width:8px;height:30px;background:var(--pk);border-radius:3px}
.fm{position:absolute;top:-17px;left:-2px;width:12px;height:18px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(#fff6b0,#ffb347);box-shadow:0 0 14px 4px #ffc86b;animation:fk .3s infinite alternate;transition:.6s}
.out .fm{opacity:0;transform:scale(0)}
@keyframes fk{to{transform:scale(1.1,.9) rotate(4deg)}}
.rev{opacity:0;max-height:0;overflow:hidden;transition:1s;font-size:22px;font-style:italic;margin-top:14px}.rev.on{opacity:1;max-height:400px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 16px;justify-content:safe center}
.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 16px;font:inherit;font-size:16px;cursor:pointer}.chip.on{background:linear-gradient(135deg,var(--pk),var(--lv));color:#fff}
.mas{columns:2;column-gap:14px}@media(min-width:700px){.mas{columns:3}}
.pol{break-inside:avoid;margin:0 0 16px;background:#fff;padding:9px 9px 12px;border-radius:6px;box-shadow:0 8px 24px #6b3a7a2e;transition:.35s;cursor:zoom-in;color:#4a2c4f;transform:rotate(var(--r))}
.pol:hover{transform:rotate(0) scale(1.04);z-index:2}
.pol img,.ph{width:100%;display:block;border-radius:3px;background:linear-gradient(135deg,#ffd3e6,#d9c8ff)}
.ph{display:flex;align-items:center;justify-content:center;color:#a07ab0;font-style:italic;text-align:center;padding:10px}
.pol small{display:block;text-align:center;font-family:'Dancing Script',cursive;font-size:17px;margin-top:6px}
#lb{position:fixed;inset:0;z-index:70;background:rgba(20,8,30,.92);display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;text-align:center;padding:16px}
#lb.on{display:flex}#lb img{max-width:96vw;max-height:76vh;border-radius:8px;animation:fi .5s}
#lb button{position:absolute;background:none;border:0;color:#fff;font-size:38px;cursor:pointer;padding:14px}
.tl{position:relative;padding-left:34px}.tl:before{content:"";position:absolute;left:10px;top:0;bottom:0;width:3px;background:linear-gradient(var(--pk),var(--lv));box-shadow:0 0 14px var(--pk);border-radius:3px}
.tm{padding:18px;margin-bottom:26px;position:relative;opacity:0;transform:translateY(30px);transition:.9s}.tm.on{opacity:1;transform:none}
.tm:before{content:"";position:absolute;left:-31px;top:24px;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--pk);box-shadow:0 0 12px var(--pk)}
.tm h3{margin:0;font:700 26px 'Dancing Script',cursive;color:var(--pk)}.tm p{white-space:pre-wrap}.tm em{color:var(--soft);font-size:16px}.tm img{width:100%;border-radius:14px;margin-top:10px}
.env{width:230px;height:150px;margin:20px auto;position:relative;cursor:pointer;background:#f6c1d8;border-radius:8px;box-shadow:0 14px 30px #b06ab344;transition:.5s}
.env:before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49%,#eaa5c6 50%) left/50% 100% no-repeat,linear-gradient(to bottom left,transparent 49%,#eaa5c6 50%) right/50% 100% no-repeat;border-radius:8px}
.env:after{content:"❤";position:absolute;left:50%;top:58%;translate:-50% -50%;color:#fff;font-size:28px}
.env.o{transform:scale(.6);opacity:0;height:0;margin:0}
.paper{display:none;padding:30px 24px;font:500 24px/1.6 'Dancing Script',cursive;white-space:pre-wrap;background:rgba(255,253,248,.85);color:#4a2c4f;max-width:640px;margin:auto;min-height:200px}.paper.on{display:block;animation:fi 1s}
.rg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(min-width:700px){.rg{grid-template-columns:repeat(5,1fr)}}
.fc{perspective:700px;aspect-ratio:3/4;cursor:pointer}.fi2{position:relative;width:100%;height:100%;transition:.8s;transform-style:preserve-3d}.fc.f .fi2{transform:rotateY(180deg)}
.fc div div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:16px;line-height:1.2}
.fc .fr{font:700 34px 'Dancing Script',cursive;color:var(--pk)}.fc .bk{transform:rotateY(180deg);background:linear-gradient(135deg,#ffd3e6cc,#e3d5ffcc);border-radius:22px;color:#4a2c4f;overflow:auto}
.sg{display:grid;gap:16px}@media(min-width:700px){.sg{grid-template-columns:1fr 1fr}}
.sc{padding:24px;text-align:center;min-height:200px}.sc p{font-style:italic;font-size:21px;margin:12px 0 0}.gc{grid-column:1/-1}#gm{white-space:pre-wrap;text-align:left;font-size:20px;font-style:normal;max-width:640px;margin:16px auto 0}
.gb{font-size:70px;cursor:pointer;display:inline-block;transition:.4s}.gb.o{transform:rotate(-12deg) scale(1.2)}
.hid{display:none}.hid.on{display:block;animation:fi 1s}.hid img{max-width:min(100%,520px);border-radius:6px;border:10px solid #fff;border-bottom-width:34px;box-shadow:0 12px 40px #ec6fa377}
.crz img{animation:cz 1.8s cubic-bezier(.2,1.3,.4,1) both,gw 2s 1.8s ease-in-out infinite alternate}
@keyframes cz{0%{transform:scale(0) rotate(-720deg);filter:blur(24px) hue-rotate(180deg)}55%{transform:scale(1.2) rotate(10deg);filter:blur(0) hue-rotate(60deg)}100%{transform:rotate(-2deg);filter:none}}
@keyframes gw{from{box-shadow:0 0 20px #ec6fa3}to{box-shadow:0 0 60px 12px #a98be0}}
@keyframes up{to{transform:translateY(-115vh) rotate(50deg);opacity:0}}@keyframes fo{to{opacity:0}}
.b:disabled{opacity:.55;cursor:not-allowed;box-shadow:none;transform:none}
#fin{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:60px 20px;background:linear-gradient(#0000,#0000),var(--bgi,linear-gradient(160deg,#f7a8c8,#a98be0));background-size:cover;background-position:center;position:relative}
#fin:before{content:"";position:absolute;inset:0;background:rgba(40,12,50,.5)}#fin>div{position:relative;color:#fff;max-width:640px}#fin h2{color:#fff;font-size:clamp(38px,10vw,70px)}#fin p{white-space:pre-line;font-size:22px}
#mp{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:60;display:none;align-items:center;gap:8px;padding:8px 12px;font-size:15px}
#mp button,#eb{background:none;border:0;color:var(--ink);font-size:22px;cursor:pointer}.nt{display:inline-block}.pl .nt{animation:fl .6s infinite alternate}
#eb{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:60;padding:10px 14px;font-size:16px;display:none}
#ed{position:fixed;inset:0;z-index:90;background:var(--bg1);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 80px;font-size:16px}
#ed h4{margin:22px 0 6px;color:var(--pk)}#ed input,#ed textarea,#ed select{width:100%;padding:8px;margin:3px 0;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--ink);font:inherit}
#ed .r{display:flex;gap:6px;align-items:center;border-top:1px solid var(--bd);padding:8px 0;flex-wrap:wrap}#ed .r img{width:54px;height:54px;object-fit:cover;border-radius:6px}#ed .r>*{flex:1 1 120px}

 first personal thing about you that only a handful of people knew, and you just started opening up to me and telling me everything.\n\nBut me being so dumb, I didn't even know what it actually was or that it was a chronic condition. 🥺 But after that call, I went and searched about it, trying to understand every single thing about it and the challenges that come with it.\n\nAnd honestly, I felt so sad. I started thinking that this girl deserves every single good thing in this world because, believe me, Tanaya, tu khup jast changli mulgi aahes, and tu saglya changlya goshti deserve karte. ❤️\n\nFrom that moment onwards, I started understanding you more deeply, empathising with you even more, and wanting to take care of you and protect you. Believe me, I'm trying my very, very best to do that, and I'll keep getting better at it every single day.\n\nAnd tula kadhich ekta nahi watu denar. I'll always try my best to make sure you never feel alone while dealing with the difficult days. I know I can't magically take away everything you've been through or the things that have made you cry so much, but I'll always be there to support you, listen to you, and remind you that you don't have to face everything alone.\n\nYou remember what I always say, right?\n\n\"Mi aahe na!\" 😚\n\nAnd I mean every single word of it. I'll always be there, okay, baccha?\n\nLove you 3000. ❤️❤️❤️","photo":-1},{"t":"Our favourite memories","date":"4th October 2026","txt":"One of the fav fav memories with you is that of last time when I visited pune tu adhich yeun ubhi hoti mala pick karaila and tujya dolyat mi toh happiness baghat hota mala ajj parenta kon ach baghun avdha happy navta zla tbh 🤣🤣\n\nBut mala khup sayi watat hota , tu mala alya alya sunflowers and kit kat dili and i was so so fucking happy coz i love small small gifts and tu mala sagli kade firavla and mla gham ala ki toh tujya rumal ni pusat hoti i felt so special 😚❤️\n\nAnd mala jeh jeh hawa hota teh sagla khau ghalat hoti and tula hug karna magun while you were riding was one of the best things 🤭🤭😙, mala khup changla watat hoti and avdha travel karun pan tu thoda pan damli nhi and mala sagli kade without any single complaints firavla and even vedya chya ghari pan mala drop kela knowing that tuja ghar literally 1 tass lamb ahe tari , mala teh khup avadla and mi ti treatment kadhich wisru shaknar nhi tanu love you for that😚😚❤️❤️\n\nSecond day mi metro ni yenar hoto and mala kahich mahit navta tu even mala ticket pan kadhun dila and being a girl jihla sarwat jast important tichi zop ahe🤣 tu still avdhya lavkar uthun and avrun tikde ali hoti metro station war and mala tya divshi pan khup firavla , osho garden walya kisses I’ll never forget 🤭🫣,  and tu tya divshi gharun bhendi chi bhaji anli hoti baccha and mala hatani pan khau ghatli legit 🥺 and i miss that and you so much bebuu and avdhi changli treatment mala konich nhi dili pillu mala literally tu tujya mula sarkhi treatment dete baccha that’s why i love to call you momma and being a strongest momma mi jevha nighalo ghari jayla you were literally crying like a baby 🥺😭, and avdha sagla karun pann tula samaj la ki jatanna mala khayla pan kahi nhi milnar tar being as thoughtful as always mala shev pav ghyun dila tu and that’s how that 2 days became one of the most unforgettable memories!!, and im pretty sure ki apan ashya memories banwat rahu pillu \n\nLove you so much, and plz heh wachtanna senti nako hou and jast zalich tar nashik la yeun ja majya kade💋😚🤭\n\nDadda loves you so much, pillu❤️❤️😙","photo":-1},{"t":"Today – Tana’s Birthday","date":"Add date","txt":"Add your memory here.","photo":-1}],"reasons":["The way you blush when i say something nice to you🤭","The persona you carry that makes me fall for you even more❤️","The way you treat every person and your positive approach always drives me crazyy💗"," The way you make ordinary moments special for me when im feeling sad💞","That cute little habits that you carry😌","The way you make me laugh /* particles */
let P=[],amb=false,cv,cx;
function ps(t,x,y,o={}){P.push(Object.assign({t,x,y,vx:0,vy:1,r:5+Math.random()*6,a:Math.random()*6,va:(Math.random()-.5)*.1,l:1e9,c:['#f7a8c8','#e5d4ff','#ffd3e6','#ec6fa3','#fff'][Math.random()*5|0]},o))}

function tick(){cx.clearRect(0,0,cv.width,cv.height);const n=Date.now()/500;
if(amb&&Math.random()<.04&&P.filter(p=>p.t=='p').length<26)ps('p',Math.random()*innerWidth,-20,{vx:Math.random()-.5,vy:.8+Math.random()});
P=P.filter(p=>{p.a+=p.va;if(p.t=='c'){p.vy+=.25;p.vx*=.98;p.l--}else if(p.t=='p')p.x+=Math.sin(p.y/45+p.a)*.7;else if(p.t=='s'){}
p.x+=p.vx;p.y+=p.t=='s'?0:p.vy;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);
if(p.t=='s'){cx.globalAlpha=.4+.4*Math.sin(n+p.a*9);cx.fillStyle='#fff';cx.shadowBlur=10;cx.shadowColor='#fff';cx.beginPath();cx.arc(0,0,p.r/4,0,7);cx.fill()}
else if(p.t=='c'){cx.globalAlpha=Math.min(1,p.l/40);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2)}
else{cx.globalAlpha=.75;cx.fillStyle=p.c;cx.beginPath();cx.ellipse(0,0,p.r,p.r/2,0,0,7);cx.fill()}
cx.restore();return p.t=='s'||(p.t=='p'?p.y<innerHeight+30:p.l>0&&p.y<innerHeight+30)});requestAnimationFrame(tick)}
function crazy(){const a=$('#app'),w=document.createElement('div');w.style.cssText='position:fixed;inset:0;background:#fff;z-index:85;pointer-events:none;animation:fo 1s forwards';a.appendChild(w);setTimeout(()=>w.remove(),1100);
